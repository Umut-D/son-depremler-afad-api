name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]" bandit pip-audit
      - run: python -m pytest
      - run: bandit -r app
      - run: pip-audit .
